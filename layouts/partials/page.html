<section class="container page{{ if eq .RelPermalink "/projects/" }} page-projects{{ end }}">
  <article>
    <header>
      <h1 class="title">
        <a class="title-link" href="{{ .Permalink | safeURL }}">
          {{ .Title }}
        </a>
      </h1>
    </header>

    {{ .Content }}
  </article>
</section>
